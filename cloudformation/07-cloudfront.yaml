AWSTemplateFormatVersion: '2010-09-09'
Description: 'Module 07: Amazon CloudFront CDN Distribution with Origin Access Control (OAC)'

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]

  DestinationBucketName:
    Type: String
    Description: Name of S3 Destination Bucket

  DestinationBucketArn:
    Type: String
    Description: ARN of S3 Destination Bucket

Resources:
  # ─── Origin Access Control (OAC) ─────────────────────────────────────────────
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${Environment}-ProcessedImages-OAC'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ─── CloudFront Distribution ─────────────────────────────────────────────────
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${Environment} Image CDN Distribution'
        PriceClass: PriceClass_100 # US, Canada, Europe for lowest cost
        HttpVersion: http2and3
        Origins:
          - Id: S3Origin
            DomainName: !Sub '${DestinationBucketName}.s3.${AWS::Region}.amazonaws.com'
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized Cache Policy ID:
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-CORS-and-SecurityHeadersPolicy ID:
          ResponseHeadersPolicyId: e6134ee9-d4e8-4223-b601-5e8138d30aa6

  # ─── S3 Destination Bucket Policy allowing CloudFront OAC ────────────────────
  DestinationBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DestinationBucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${DestinationBucketArn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution.Id}'

Outputs:
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
    Description: CloudFront Distribution ID
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'

  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
    Description: CloudFront CDN Domain Name
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDomain'
