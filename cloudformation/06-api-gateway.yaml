AWSTemplateFormatVersion: '2010-09-09'
Description: 'Module 06: Amazon API Gateway REST API with CORS and Throttling'

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]

  PresignedUrlGeneratorFunctionArn:
    Type: String
    Description: ARN of Presigned URL Generator Lambda Function

Resources:
  # ─── REST API ────────────────────────────────────────────────────────────────
  ImageUploadApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${Environment}-ImageUploadApi'
      Description: REST API for generating S3 Pre-signed upload URLs
      EndpointConfiguration:
        Types:
          - REGIONAL

  # ─── API Resource /upload-url ────────────────────────────────────────────────
  UploadUrlResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ImageUploadApi
      ParentId: !GetAtt ImageUploadApi.RootResourceId
      PathPart: 'upload-url'

  # ─── GET Method ──────────────────────────────────────────────────────────────
  UploadUrlGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ImageUploadApi
      ResourceId: !Ref UploadUrlResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PresignedUrlGeneratorFunctionArn}/invocations'

  # ─── OPTIONS Method (CORS Preflight) ─────────────────────────────────────────
  UploadUrlOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ImageUploadApi
      ResourceId: !Ref UploadUrlResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: '{"statusCode": 200}'
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # ─── API Deployment ──────────────────────────────────────────────────────────
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UploadUrlGetMethod
      - UploadUrlOptionsMethod
    Properties:
      RestApiId: !Ref ImageUploadApi

  # ─── API Stage with Throttling ───────────────────────────────────────────────
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: !Ref Environment
      RestApiId: !Ref ImageUploadApi
      DeploymentId: !Ref ApiDeployment
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 200
          ThrottlingRateLimit: 100
          MetricsEnabled: true
          LoggingLevel: INFO

  # ─── Permission: API Gateway -> Lambda ───────────────────────────────────────
  ApiGatewayLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PresignedUrlGeneratorFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ImageUploadApi}/*/*/*'

Outputs:
  ApiEndpointUrl:
    Value: !Sub 'https://${ImageUploadApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/upload-url'
    Description: Endpoint URL for requesting Pre-signed upload URLs
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpointUrl'

  RestApiId:
    Value: !Ref ImageUploadApi
    Description: ID of API Gateway REST API
    Export:
      Name: !Sub '${AWS::StackName}-RestApiId'
